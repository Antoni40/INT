<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="exDiv">
        <h2>Ćwiczenie 1</h2>
        <button id="clickMeButton">Naciśnij mnie</button>
    </div>
    <hr/>

    <div class="exDiv">
        <h2>Ćwiczenie 2</h2>
        <form>
            <label for="studentAgeInput">Wiek:</label>
            <input type="number" id="studentAgeInput">

            <button id="submitAgeButton">Potwierdz</button>
        </form>
    </div>
    <hr/>
    
    <div class="exDiv">
        <h2>Ćwiczenie 3</h2>
        <div class="shoppingSection">
            <form id="shoppingForm">
                <h2>Formularz do listy zakupów</h2>
                <div id="shoppingFormCheckboxes">

                </div>
                <button>Potwierdz</button>
            </form>
            <div>
                <h2>Lista zakupów</h2>
                <ul id="shoppingListElm">

                </ul>
            </div>  
        </div>
    </div>
    <hr/>

    <div class="exDiv">
        <h2>Ćwiczenie 4</h2>
        <form id="personalDataForm">
            <div>
                <label for="firstName">Imię</label>
                <input type="text" id="firstNameInput" name="firstName">
            </div>

            <div>
                <label for="age">Wiek:</label>
                <input type="number" id="ageInput" name="age">
            </div>

            <button>Potwierdz</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
